name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check asset
        run: ls -l release/*.apk

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.apk \
              --title "SH Bridge ${GITHUB_REF_NAME}" \
              --notes-file .github/release-notes.md
          fi
